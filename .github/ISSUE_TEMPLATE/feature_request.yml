name: Tool or feature idea
description: Suggest a new tool, or a change to one
labels: [idea]
body:
  - type: dropdown
    id: site
    attributes:
      label: Site
      options:
        - ImgTool (images)
        - PDFTool (PDFs)
        - VidTool (video)
        - AudioTool (audio)
        - QRTool (QR codes and barcodes)
        - OCRTool (text from images)
        - DevTool (developer tools)
        - CalcTool (calculators)
        - ColorTool (colours)
        - MusicTool (music)
        - kmra.dev (the hub)
        - A new site
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: The job it does
      description: What you're trying to get done, and who it helps
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Other tools you've used, and what's missing in them
  - type: checkboxes
    id: local
    attributes:
      label: Runs in the browser
      description: Every kmra.dev tool works on the device, with no server.
      options:
        - label: As far as I know, this can work without uploading files anywhere
