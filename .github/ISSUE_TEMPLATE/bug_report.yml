name: Bug report
description: A tool doesn't work as expected
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the tool
      placeholder: https://imgtool.kmra.dev/compress
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Sample file
      description: If it depends on a file, describe it (type, size). Attach one only if it's fine to share publicly.
