name: CI

# After a merge. Everything about the change was proved on the pull request; what that couldn't
# answer is whether main is still good now that the change is in it, since two branches that
# each passed can still be wrong together. So this runs the same checks on main itself, while
# Vercel deploys it. It's also what the badge in the README reports.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm vercel:json --check

  e2e:
    name: End to end (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: End to end
        run: pnpm test:e2e:only --shard=${{ matrix.shard }}/3
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
