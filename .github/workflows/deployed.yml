name: Deployed

# After Vercel finishes a production deployment of a site, tell the IndexNow search engines
# (Bing, Yandex and others) about its pages, read from the live sitemap. Vercel reports each
# deployment to GitHub with the environment "Production – <project>", and the projects are
# named after the sites (imgtool, pdftool… and kmra for the hub).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  indexnow:
    name: Tell search engines
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: IndexNow
        env:
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          site="${ENVIRONMENT##* }"
          case "$site" in
            imgtool|pdftool|qrtool|devtool|ocrtool|vidtool|audiotool|calctool|colortool|musictool|kmra)
              node scripts/indexnow.ts "$site" ;;
            *) echo "Not a kmra.dev site: $ENVIRONMENT" ;;
          esac
