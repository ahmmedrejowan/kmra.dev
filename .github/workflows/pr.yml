name: Pull request

# The gate. Nothing reaches main without this passing, so it's the thorough one: type checks,
# formatting, every site built, and every tool tested in a real browser against the production
# builds with their real headers. The end-to-end tests are split across four machines so the
# whole thing takes minutes, not half an hour. There is no second run after the merge: main only
# changes through a pull request that passed this.
#
# Pull requests are never deployed: Vercel builds only main (see apps/<site>/vercel.json),
# so this is where a change is proved, not on a preview site.
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm vercel:json --check

  # A pull request that adds or upgrades a package with a known vulnerability fails here, with
  # a summary on the pull request. (Licences aren't restricted: everything the sites use is
  # compatible with the AGPL.)
  dependencies:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  e2e:
    name: End to end (${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The video and audio test files are made with ffmpeg, and their outputs checked with
      # ffprobe. A static build (7.0.2, from the ffmpeg-static project's GitHub release) instead
      # of apt: Ubuntu's mirror stalled or was unreachable on some runners. Fetched once, then
      # restored from the cache on every shard; the checksums pin the exact files.
      - uses: actions/cache@v6
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-b6.1.1
      - name: ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/ffmpeg
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -fsSL --retry 3 -o /tmp/ffmpeg.gz "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o /tmp/ffprobe.gz "$base/ffprobe-linux-x64.gz"
          echo "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  /tmp/ffmpeg.gz" | sha256sum -c
          echo "25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  /tmp/ffprobe.gz" | sha256sum -c
          gzip -dc /tmp/ffmpeg.gz > ~/ffmpeg/ffmpeg
          gzip -dc /tmp/ffprobe.gz > ~/ffmpeg/ffprobe
          chmod +x ~/ffmpeg/ffmpeg ~/ffmpeg/ffprobe
      - run: |
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          ~/ffmpeg/ffmpeg -hide_banner -version | head -1
      # Browsers are kept between runs (keyed by the Playwright version); only their system
      # libraries are installed each time
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Browsers (Chromium for every site; Firefox and WebKit for the image tools)
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Generated test files (photos, PDFs, clips, tones) are kept until a generator changes
      - uses: actions/cache@v6
        with:
          path: tests/fixtures/gen
          key: fixtures-${{ hashFiles('tests/fixtures/*.ts', 'tests/helpers.ts') }}
      - run: pnpm build
      - name: End to end
        run: pnpm test:e2e:only --shard=${{ matrix.shard }}/4
      # Traces and screenshots of every failed attempt, including tests that passed on retry
      # (flaky), so a failure that doesn't repeat can still be looked at
      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
